plugins {
    id 'com.github.gmazzo.buildconfig' version "${build_config_version}"
    id 'application'
}

group = project.group
version = project.version

var userDir = System.getProperty("user.dir")
var separator = System.getProperty("file.separator")

println(' Java: ' + System.getProperty('java.version') +
        ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ')' +
        ' Arch: ' + System.getProperty('os.arch'))

buildConfig {
    buildConfigField(String, "HASH", "${execute("git rev-parse --short HEAD")}")
    buildConfigField(String, "BRANCH", "${execute("git branch --show-current")}")
    buildConfigField(String, "VERSION", project.version.toString())
    buildConfigField(String, "BUILD", project.build_number.toString())
    buildConfigField(String, "BUILD_TIME", "${new Date(System.currentTimeMillis()).format("MM/dd/yyyy HH:mm")}")

    packageName "us.nebula"
    useJavaOutput()
    generateAtSync = true
}

application {
    mainClass = 'Start'
    applicationDefaultJvmArgs = ["-Djava.library.path=${userDir}${separator}natives"]
}

run {
    workingDir = file("${userDir}${separator}run${separator}")
}

sourceSets.main.java.srcDirs += "build/gen/buildconfig/src/main"

repositories {
    mavenCentral()
    maven {
        name = 'Velocity Repository'
        url = 'https://nexus.velocitypowered.com/repository/maven-public/'
    }
    maven {
        name = 'Carm Repository'
        url = 'https://repo.carm.cc/repository/maven-public/'
    }
}

configurations {
    library
    compile
}

dependencies {
    implementation group: 'javax.vecmath', name: 'vecmath', version: vecmath_version
    implementation group: 'net.java.dev.jna', name: 'jna', version: jna_version
    implementation group: 'net.sf.jopt-simple', name: 'jopt-simple', version: jopt_simple_version
    implementation group: 'net.sf.trove4j', name: 'trove4j', version: trove4j_version
    implementation group: 'io.netty', name: 'netty-all', version: netty_version
    implementation group: 'commons-io', name: 'commons-io', version: commons_io_version
    implementation group: 'com.google.code.gson', name: 'gson', version: gson_version

    implementation group: 'org.lwjgl.lwjgl', name: 'lwjgl', version: lwjgl_version
    implementation group: 'org.lwjgl.lwjgl', name: 'lwjgl-platform', version: lwjgl_version, ext: 'pom'
    implementation group: 'org.lwjgl.lwjgl', name: 'lwjgl_util', version: lwjgl_version

    implementation group: 'org.apache.logging.log4j', name: 'log4j-core', version: log4j_version
    implementation group: 'org.apache.logging.log4j', name: 'log4j-api', version: log4j_version
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: commons_lang3_version

    implementation fileTree('libraries')
    implementation configurations.library
}

def execute(String cmd) {
    try {
        def stdout = new ByteArrayOutputStream()

        exec {
            commandLine cmd.split(" ")
            standardOutput = stdout
        }

        return stdout.toString().trim()
    } catch (ignored) {
        return null
    }
}

jar {
    from {
        configurations.library.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.withType(JavaCompile).configureEach {
    dependsOn(generateBuildConfig)
}