import us.nebula.gradle.PublishBuildDataTask

plugins {
    id 'com.github.gmazzo.buildconfig' version "${build_config_version}"
    id 'application'
}

group = project.group
version = project.version

var buildNumber = project.build_number
var gitHash = execute("git rev-parse --short HEAD")
var gitBranch = execute("git branch --show-current")
var directory = "${System.getProperty("user.dir")}${System.getProperty("file.separator")}"

buildConfig {
    buildConfigField(String, "HASH", gitHash)
    buildConfigField(String, "BRANCH", gitBranch)
    buildConfigField(String, "VERSION", project.version)
    buildConfigField(String, "BUILD", buildNumber)
    buildConfigField(String, "BUILD_TIME", "${new Date(System.currentTimeMillis()).format("MM/dd/yyyy HH:mm")}")

    packageName "us.nebula"
    useJavaOutput()
    generateAtSync = true
}

static def getJVMArgs() {
    // stolen from the mc launcher - run as close as we can to the launcher
    var args = [
            "-XX:+UnlockExperimentalVMOptions",
            "-XX:+UseG1GC",
            "-XX:G1NewSizePercent=20",
            "-XX:G1ReservePercent=20",
            "-XX:MaxGCPauseMillis=50",
            "-XX:G1HeapRegionSize=32M"
    ]

    String separator = System.getProperty("file.separator")
    var nativeLibraryPath = "-Djava.library.path=${System.getProperty("user.dir")}${separator}dependencies${separator}"

    switch (getOSType()) {
        case OS.MAC: {
            // this prevents a crash in a dylib where it creates a window in a different thread...
            //args.add("-XstartOnFirstThread")
            nativeLibraryPath = nativeLibraryPath + "macos${separator}natives"
            break
        }
        case OS.WINDOWS: {
            nativeLibraryPath = nativeLibraryPath + "windows"
            break
        }
        case OS.UNIX: {
            // TODO: im too lazy to add the natives needed...
            println "Unix is not supported for gradle builds yet..."
        }
    }

    args.add(nativeLibraryPath)
    return args
}

application {
    mainClass = 'Start'
    applicationDefaultJvmArgs = getJVMArgs()
}

run {
    workingDir = file("${directory}run")
    args += "-gameDir=" + workingDir.absolutePath
}

sourceSets.main.java.srcDirs += "build/gen/buildconfig/src/main"

repositories {
    mavenCentral()
    maven {
        name = 'Velocity Repository'
        url = 'https://nexus.velocitypowered.com/repository/maven-public/'
    }
    maven {
        name = 'Carm Repository'
        url = 'https://repo.carm.cc/repository/maven-public/'
    }
}

configurations {
    library
}

var dependenciesPath = "dependencies${System.getProperty("file.separator")}"

dependencies {
    library group: 'net.java.dev.jna', name: 'jna', version: jna_version
    library fileTree("${dependenciesPath}buildLibraries")
    // multi-os support!!
    implementation fileTree("${dependenciesPath}shared")
    implementation configurations.library

    // why is this such a pain in my dick to do...
    // using 2.9.4 on MacOS crashes real nice...
    // for whatever reason, the repos do not have the 2.9.1 version either so... manually add them i guess
    if (getOSType() == OS.MAC) {
        implementation fileTree("${dependenciesPath}macos/libraries")
    } else {
        implementation group: 'org.lwjgl.lwjgl', name: 'lwjgl', version: lwjgl_version
        implementation group: 'org.lwjgl.lwjgl', name: 'lwjgl-platform', version: lwjgl_version, ext: 'pom'
        implementation group: 'org.lwjgl.lwjgl', name: 'lwjgl_util', version: lwjgl_version
    }
}

jar {
    from {
        configurations.library.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    manifest.attributes(
            'Nebula-Version': project.version,
            'Nebula-BuildID': buildNumber,
            'Nebula-Branch': gitBranch,
            'Nebula-Hash': gitHash,
            'ImInYourWalls': 'true'
    )
}

tasks.register('publishBuildData', PublishBuildDataTask) {
    it.directory = directory
    it.gitHash = gitHash
    it.buildID = buildNumber
    it.version = project.version
}

tasks.withType(JavaCompile).configureEach {
    dependsOn(generateBuildConfig)
}

tasks.withType(Copy).configureEach {
    it.duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

def execute(String cmd) {
    try {
        def stdout = new ByteArrayOutputStream()

        exec {
            commandLine cmd.split(" ")
            standardOutput = stdout
        }

        return stdout.toString().trim()
    } catch (ignored) {
        return null
    }
}

static def getOSType() {
    final String name = System.getProperty("os.name").toLowerCase()
    if (name.startsWith("mac")) {
        return OS.MAC
    } else if (name.startsWith("win")) {
        return OS.WINDOWS
    }
    return OS.UNIX
}

/*
 * Copyright (c) xgraza 2025
 */

enum OS {
    WINDOWS,
    MAC,
    UNIX
}