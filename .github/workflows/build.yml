name: "Build Nebula Rewrite with Gradle and Java 8, uploading as an artifact"
on: [ push, pull_request ]
jobs:
  validation:
    name: "Create build environment"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
        with:
          min-wrapper-count: 1

      - name: "Download JDK 8"
        uses: actions/setup-java@v5
        with:
          distribution: "adopt-openj9"
          java-version: 8
          job-status: success

      - name: "Grant execute permission for gradlew"
        run: chmod +x gradlew
  build:
    name: "Build Nebula Rewrite"
    runs-on: ubuntu-latest
    steps:
      - name: "Setup gradle"
        uses: gradle/actions/setup-gradle@v6
      - name: "Build with gradle"
        run: ./gradlew build --no-daemon
  upload:
    name: "Upload artifact to GitHub actions"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v7
        with:
          name: "package"
          path: "build/libs/nebula-rewrite-4.0.0.jar"
          if-no-files-found: error
          retention-days: 30
          archive: false
        env:
          JAVA_HOME: /opt/hostedtoolcache/Java_Adopt-OpenJ9_jdk/8.0.312-7/x64
          GRADLE_BUILD_ACTION_CACHE_RESTORED: true